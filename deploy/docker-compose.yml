# Cairndex — server deployment (NAS / self-host).
#
# Self-contained: the server needs this file and nothing else. No checkout of
# the repository, no build toolchain, no source on the box — the image is
# pulled from a registry.
#
# ┌─ EDIT BEFORE STARTING ──────────────────────────────────────────────────┐
# │ 1. CAIRNDEX_LIBRARY_PATH below — the host path of your media.           │
# │ 2. CAIRNDEX_MACHINE_NAME — what this server calls itself.               │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Cairndex sees only what you mount. Mounts live under /libraries, one per
# share (/libraries/main, /libraries/archive) — a mount is not a library, and
# one mount can hold many. Details at the volumes section below.
#
# Every setting has a working default written into this file, so a NAS Docker
# UI that pastes or uploads a compose file works with no `.env` beside it. If
# you do run it from a shell, an `.env` in the same directory still overrides
# any of them; `deploy/.env.example` in the repository is a starting point.
#
#   docker compose up -d                          # start
#   docker compose pull && docker compose up -d   # update
#   docker compose down                           # stop (releases library leases)
#
# To run an unpublished branch instead, build from a checkout with
# docker-compose.prod.yml at the repository root.
#
# SECURITY: Cairndex has no authentication yet (AGENTS.md §12). Anyone who can
# reach the port can use it. That is why the default below is your LAN and not
# the world — do not port-forward this or put it on a public interface. For
# access from outside the house, use Tailscale or a VPN, not a router rule.

services:
  app:
    # Pinning a version (…:0.1.0) rather than :latest means an update is
    # something you decide, and a `docker compose pull` cannot change what runs
    # under you. :latest is the convenient default; the choice is yours.
    image: ghcr.io/allpan3/cairndex:${CAIRNDEX_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Who the app runs as. Left alone it is uid 10001, a user created in the
    # image, and every path you mount must be writable by *that* id — which on a
    # NAS means chowning your own directories to a number you did not choose.
    #
    # Uncomment with your own id instead (`id -u` and `id -g` on the NAS) and no
    # ownership changes are needed anywhere: the app writes as you, into
    # directories you already own. It also means files Cairndex creates stay
    # readable to your backups, rather than belonging to 10001.
    #
    # This works because the app writes only to /data, /tmp and the library
    # mounts — all supplied from outside — and the smoke test checks that stays
    # true. One caveat: /data must be a bind mount, as below. A *named* volume
    # takes its ownership from the image, i.e. 10001, and would lock you out.
    #
    # user: "1000:1000"
    ports:
      # 0.0.0.0 — reachable from other machines on your network, which is the
      # point of running this on a NAS. (The repository-root compose file
      # defaults to loopback instead, because there "the server" is the same
      # machine as the browser.) Narrow it to one interface by replacing
      # 0.0.0.0 with that address. See the security note above.
      - "${CAIRNDEX_BIND_ADDR:-0.0.0.0}:${CAIRNDEX_PORT:-8000}:8000"
    environment:
      CAIRNDEX_ENVIRONMENT: production
      # Baked into the image; override only if you remap the volumes below.
      CAIRNDEX_STATIC_DIR: /app/web
      CAIRNDEX_DATA_DIR: /data
      # ADR-0018: recorded in each library's ownership lease, and shown to
      # anyone whose other machine finds this server holding a library. Unset,
      # it defaults to the container's hostname — a hex id naming nothing.
      CAIRNDEX_MACHINE_NAME: ${CAIRNDEX_MACHINE_NAME:-cairndex-server}
      # Where other machines can reach this server. Set it, and a machine that
      # finds this one holding a library can offer "connect there instead"
      # rather than only naming a host. Only non-loopback URLs are ever offered.
      CAIRNDEX_ADVERTISED_URL: ${CAIRNDEX_ADVERTISED_URL:-}
      # ADR-0013 deployment master switch for guarded file operations.
      # `allowed` lets each library's own opt-in (off by default) decide;
      # `disabled` forces every library read-only and makes the per-library
      # toggle un-flippable.
      CAIRNDEX_WRITE_MODE: ${CAIRNDEX_WRITE_MODE:-allowed}
    volumes:
      # Server-local runtime state: registry.db, transcode scratch, backups.
      # Per-library content metadata lives in each library's own .cairndex/.
      - cairndex-data:/data
      # >>> EDIT: the host path of your media, before the colon. <<<
      #
      # Everything Cairndex can see, it sees because you mounted it here. Each
      # mount is a child of /libraries, and the name you give it is yours —
      # /libraries/main below is just a starting one.
      #
      # A mount is a *share*, not a library. One mount can hold many libraries:
      # with this line, /volume1/media/films and /volume1/media/photos can each
      # be a separate library, created live in the app, with no change here and
      # no restart. You only come back to this file when files live somewhere
      # the container cannot see at all — a different volume or share:
      #
      #   - "/volume2/archive:/libraries/archive:rw"
      #   - "/volume3/photos:/libraries/photos:rw"
      #
      # Mount each share under its own name rather than moving this one. The
      # registry records the path a library was registered under, so re-pathing
      # an existing mount means re-registering everything inside it.
      #
      # It must be writable by uid 10001, the container's non-root user:
      # Cairndex keeps each library's portable package at
      # <library>/.cairndex/{manifest.json,library.db,cache/}. That is metadata.
      # Your media files are not moved, renamed, deleted, or rewritten by any
      # ordinary flow — only by an explicit write-mode operation (ADR-0013),
      # which is off by default per library.
      - "${CAIRNDEX_LIBRARY_PATH:-/volume1/media}:/libraries/main:rw"
    # The app only needs its mounted volumes to be writable, so the rest of the
    # container filesystem is not.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Shutdown releases each library's ownership lease and checkpoints its WAL
    # back into library.db (ADR-0018 §6). A SIGKILL part-way through strands the
    # lease until it ages out (5 minutes), during which nothing else — including
    # your desktop app — opens that library without a confirmed takeover.
    # Docker's default grace period is 10s; this buys room for a large or
    # network-mounted library.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Unbounded json-file logs are a classic way to fill a NAS volume months
    # after a deployment anyone has stopped thinking about.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cairndex-data:
