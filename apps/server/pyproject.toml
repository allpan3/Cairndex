[project]
name = "cairndex-server"
version = "0.2.1"
description = "Cairndex backend: FastAPI service for a local-first media asset manager."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-ulid>=2.7",
    "pillow>=12.3.0",
    # Decode-only HEIF, deliberately NOT `pillow-heif` (ADR-0019 §3,
    # THIRD-PARTY-NOTICES.md). Same maintainer and codebase; the difference is
    # that pillow-heif's wheel bundles libx265 (GPL-2.0+) for encoding and
    # libheif names it in a load command, so importing it pulls GPL code into
    # this process. Cairndex only ever decodes HEIC, so that encoder was 8.6 MB
    # of copyleft obligation buying nothing.
    "pi-heif>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
    "pyinstaller>=6.21.0",
    # Encoder-capable HEIF, for generating the smoke test's HEIC fixture only.
    # Development-only on purpose: dev dependencies are not distributed, the
    # fixture is written by the test process rather than the frozen sidecar, and
    # the PyInstaller spec excludes this package so it cannot reach a bundle.
    "pillow-heif>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairndex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
# `packaging/` is in scope because it decides what goes into a published
# binary — ffmpeg_manifest.py is the checksum gate (ADR-0019 §3). It sat
# outside the gate at first simply because the gate named `src`.
files = ["src", "packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
