[package]
name = "cairndex-desktop"
version = "0.2.1"
description = "Cross-platform desktop shell for Cairndex"
authors = ["Cairndex contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Already vendored transitively as Tauri's menu backend; Tauri does not re-export
# `Accelerator`, so the keymap test parses accelerator strings through muda
# directly. Test-only, so it adds no weight to the shipped binary.
# `default-features = false` deliberately drops the `libxdo`/`gtk` features: the
# accelerator parser needs neither, and enabling them would make the Ubuntu
# Rust-only CI job require libxdo-dev (AGENTS.md cross-platform gate).
# Pinned exactly: the test is only meaningful if it validates accelerators through
# the SAME parser that registers them, so this must track the muda version Tauri
# vendors. Bumping Tauri may require bumping this in the same change.
muda = { version = "=0.19.3", default-features = false }

[dependencies]
# `drag` is the cross-platform engine behind `tauri-plugin-drag`. We depend on it
# directly (rather than the plugin) so drag-out paths are resolved and validated
# entirely in Rust via `mappings.rs`; the plugin only exposes a JS command that
# would require handing absolute filesystem paths to the web layer (plan 3 §6/§10).
drag = "2.1.1"
getrandom = "0.4"
percent-encoding = "2.3.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `macos-private-api` enables wry's `transparent` feature, which is what makes the
# window `backgroundColor` in tauri.conf.json actually disable WKWebView's opaque
# white backing surface (private `drawsBackground` KVC key). Without it the webview
# flashes white on startup regardless of reveal timing (ADR-0020). Incompatible
# with Mac App Store review; we ship app/dmg bundles only.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
url = "2"
