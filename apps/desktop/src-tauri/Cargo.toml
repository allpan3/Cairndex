[package]
name = "cairndex-desktop"
version = "0.1.0"
description = "Cross-platform desktop shell for Cairndex"
authors = ["Cairndex contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `drag` is the cross-platform engine behind `tauri-plugin-drag`. We depend on it
# directly (rather than the plugin) so drag-out paths are resolved and validated
# entirely in Rust via `mappings.rs`; the plugin only exposes a JS command that
# would require handing absolute filesystem paths to the web layer (plan 3 §6/§10).
drag = "2.1.1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
url = "2"
