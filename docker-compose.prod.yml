# Cairndex production stack (single hardened container).
#
# This is the NAS/self-host deployment — NOT the dev stack in
# docker-compose.yml (which bind-mounts source and hot-reloads). One container
# serves the API and the built SPA on port 8000. See docs/deployment.md.
#
#   cp .env.example .env      # then edit CAIRNDEX_LIBRARY_PATH etc.
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Building on the NAS itself gives you its architecture for free. To build on a
# Mac for an amd64 NAS instead, see `just docker-build-nas` and the
# "Building for the NAS from another machine" section of docs/deployment.md.
#
# Do NOT expose this directly to the public internet — optional passphrases are lightweight access guards. Reach it over a private network/Tailscale.

services:
  app:
    build:
      context: .
      dockerfile: infra/docker/production.Dockerfile
    image: cairndex:latest
    restart: unless-stopped
    ports:
      # Bind to localhost by default; a reverse proxy / Tailscale fronts it.
      - "${CAIRNDEX_BIND_ADDR:-127.0.0.1}:${CAIRNDEX_PORT:-8000}:8000"
    environment:
      CAIRNDEX_ENVIRONMENT: production
      # The built SPA and app-data dir are baked into the image; override only
      # if you remap the volumes below.
      CAIRNDEX_STATIC_DIR: /app/web
      CAIRNDEX_DATA_DIR: /data
      CAIRNDEX_PRIVATE_BACKUP_DIR: /backups
      # Remote progressive playback can devolve into a storm of short Range
      # requests even when NAS throughput is ample. Copy-only HLS keeps the
      # source codecs while delivering bounded media segments instead.
      CAIRNDEX_PREFER_HLS: ${CAIRNDEX_PREFER_HLS:-true}
    volumes:
      # Private working databases, credentials, jobs and caches.
      - cairndex-data:/data
      - cairndex-backups:/backups
      # Source media and writable immutable metadata; no mutable SQLite.
      - "${CAIRNDEX_LIBRARY_PATH:-./media}:/libraries/main:rw"
    # Defense in depth: the app only needs writable mounted volumes (/data and
    # /libraries/main/.cairndex), so the rest of the container filesystem can be
    # read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Allow private work and media processes to close before forced shutdown.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Unbounded json-file logs are a classic way to fill a NAS volume months
    # after a deployment anyone has stopped thinking about.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cairndex-data:
  cairndex-backups:
