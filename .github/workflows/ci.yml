name: CI

# The repository went public on 2026-07-23, so standard GitHub-hosted runners —
# including `macos-latest` — are free and unmetered. An earlier revision of this
# file restricted the desktop jobs to pull requests, because while the repo was
# private macOS billed at 10x and `Desktop shell (macOS)` was 1,570 of 2,691
# billable minutes over 30 days. That restriction was a cost trade, it bought
# nothing once the meter stopped, and it cost coverage on direct-to-main
# commits — so it is gone. Do not reintroduce it without a cost to point at.
#
# `paths-ignore` stays: skipping docs-only changes is worth it for feedback
# latency and queue noise, not just money. Roughly half this repository's
# commits touch only docs, and nothing here validates prose. A commit that
# changes docs *and* code still runs everything — the filter skips only when
# every changed file matches.
#
# `workflow_dispatch` runs the full matrix by hand against any ref.
on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "docs/**"
      - "**/*.md"
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - .gitignore
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg (for scanner/probe/thumbnail tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync dependencies (provisions Python 3.12 from .python-version)
        run: uv sync --frozen
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src packaging
      - name: pytest
        run: uv run pytest

  sidecar:
    name: Packaged sidecar (build + smoke test)
    # The unit suite imports from source, where every module is present, so it
    # structurally cannot catch a PyInstaller bundle missing a dynamically
    # resolved import — that failure only appears when the frozen code path
    # first runs. This job builds the real bundle and drives it over HTTP
    # (ADR-0019 §2), so such a gap fails the build instead of a user's first
    # launch.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg (the smoke test scans and previews real fixtures)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      # --skip-ffmpeg because linux-x86_64 is deliberately unpinned: the builds
      # that cover both macOS architectures ship a Linux variant with
      # --enable-decklink, which forces --enable-nonfree and cannot be
      # redistributed (ADR-0019 §3). Linux is not a release target, so this job
      # uses the runner's system ffmpeg. Proving the *bundled* binary works is
      # the macOS job's business, where the pin exists.
      - name: Build the sidecar bundle
        run: uv run python packaging/build_sidecar.py --skip-ffmpeg
      - name: Smoke-test the packaged sidecar
        run: uv run python packaging/smoke_test.py

  frontend:
    name: Frontend (lint, types, unit, build, browser e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e:frontend

  fullstack-e2e:
    name: Full-stack e2e (real backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync backend dependencies
        run: uv sync --frozen
        working-directory: apps/server
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Full-stack end-to-end tests
        run: npm run test:e2e:fullstack

  desktop-linux:
    name: Desktop Rust (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Update apt metadata
        run: sudo apt-get update
        working-directory: .
      - name: Install Tauri system dependencies
        run: >-
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install SPA dependencies
        run: npm ci
        working-directory: apps/web
      - name: Build SPA for Tauri compile context
        run: npm run build
        working-directory: apps/web
      # tauri-build copies `bundle.resources` at *compile* time, so a missing
      # path fails `cargo check`, not just `tauri build`. This job deliberately
      # does not build the real sidecar (that would need uv and PyInstaller here
      # for no extra coverage — the macOS job and the `sidecar` job both build
      # it). An empty directory satisfies the resource copier, which skips empty
      # directories, and `binary_path()` still reports `not_bundled` at runtime.
      - name: Placeholder for the sidecar resource
        run: mkdir -p apps/server/packaging/dist/cairndex-sidecar
        working-directory: .
      - name: Rust format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  desktop-macos:
    name: Desktop shell (macOS)
    runs-on: macos-latest
    # Free on a public repo, but a hung Tauri build would still occupy a runner
    # for GitHub's default six hours. Observed cold-cache wall time is ~4.5 min.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/package-lock.json
      - name: Install SPA dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build SPA for Tauri compile context
        run: npm run build
        working-directory: apps/web
      - name: Install uv (for the sidecar bundle)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Sync server dependencies
        run: uv sync --frozen
        working-directory: apps/server
      # Keyed on the manifest, so a re-pin re-downloads and everything else
      # reuses ~125 MB of binaries. The vendor directory is platform-scoped, so
      # this key and path name the same architecture the runner builds.
      - name: Cache the pinned static ffmpeg
        uses: actions/cache@v6
        with:
          path: apps/server/packaging/vendor/ffmpeg/macos-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('apps/server/packaging/ffmpeg-manifest.json') }}
      - name: Fetch the pinned static ffmpeg
        run: uv run python packaging/fetch_ffmpeg.py
        working-directory: apps/server
      # tauri.conf.json stages this bundle as a resource, so `tauri build`
      # cannot run without it. This job builds *with* the bundled ffmpeg, which
      # is what a release ships — the checksum gate in build_sidecar.py fails
      # the build if the staged binary is not the pinned one (ADR-0019 §3).
      - name: Build the sidecar bundle
        run: uv run python packaging/build_sidecar.py
        working-directory: apps/server
      # The Linux `sidecar` job smoke-tests a bundle built with --skip-ffmpeg,
      # so it exercises the media paths against the runner's system ffmpeg and
      # cannot fail on a bad bundled binary. This is the only place the shipped
      # combination — frozen server plus the pinned static ffmpeg — is actually
      # run (ADR-0019 §2).
      - name: Smoke-test the packaged sidecar (with the bundled ffmpeg)
        run: uv run python packaging/smoke_test.py
        working-directory: apps/server
      - name: Rust format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # CAIRNDEX_SIDECAR_BIN switches the lifecycle test from skipped to real:
      # it spawns the packaged sidecar and checks the loopback bind, the token
      # gate, and that closing stdin stops it. Without the variable that test
      # passes without proving anything.
      - name: Unit tests (including the real sidecar lifecycle)
        run: cargo test --locked
        env:
          CAIRNDEX_SIDECAR_BIN: >-
            ${{ github.workspace }}/apps/server/packaging/dist/cairndex-sidecar/cairndex-sidecar
      # `--bundles app` deliberately overrides the config's ["app", "dmg"].
      # Tauri's DMG bundler drives Finder over AppleScript, which is a known flake
      # source on headless runners. CI only needs to prove the app compiles and
      # bundles; the DMG is produced by release/local builds (docs/deployment.md).
      - name: Build Tauri app
        run: npm run tauri build -- --bundles app
        working-directory: apps/desktop

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images and guard their contexts
        run: ./infra/docker/build-and-check.sh cairndex:ci
      # Building only proves the Dockerfile parses and the dependencies resolve.
      # This job was green for a month while the image's entrypoint ran a
      # migration command that no longer did anything and the dev image had no
      # ffmpeg at all. The smoke test starts the image and exercises the paths
      # that actually rot: startup under the read-only root filesystem, the
      # non-root user writing its volumes, ffprobe/ffmpeg during a scan, and a
      # graceful shutdown releasing the ownership lease.
      - name: Smoke-test the production image
        run: ./infra/docker/smoke.sh cairndex:ci
