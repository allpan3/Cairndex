name: Publish image

# Builds the production container image and pushes it to GitHub Container
# Registry, so a server can run Cairndex with a compose file and nothing else —
# no git checkout, no build toolchain, no source on the box. See `deploy/`.
#
# Publication is tied to a deliberate act, never to a push to `main`: a version
# tag, or a manual dispatch. That matches how `release.yml` treats the desktop
# app (it builds a *draft* release and leaves publishing to a human). A registry
# has no draft state, so the trigger is where that decision lives instead.
#
# The image is **smoke-tested before it is pushed**, not after. It is built to
# the runner's local daemon first, `infra/docker/smoke.sh` starts it and
# exercises a real scan, and only then are those exact local image tags pushed.
# There is no post-test rebuild that could resolve different base or dependency
# bytes. The alternative, publishing and then testing, means a broken image is
# reachable by anyone who pulls in between, and `:latest` would have to be
# rolled back rather than never moved.
# This whole workflow exists downstream of a month in which a build-only CI job
# stayed green while the image's entrypoint ran a no-op migration command and
# the dev image had no ffmpeg at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. edge, or a branch name)"
        required: true
        default: edge
        type: string

# Least privilege: read the repository, write packages. Nothing here creates a
# release or moves a ref.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # github.repository would be "allpan3/Cairndex" — GHCR requires a lowercase
  # path, and a capital letter is rejected at push time rather than normalized.
  IMAGE: ghcr.io/${{ github.repository_owner }}/cairndex

jobs:
  publish:
    name: Build, smoke-test, push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # A version tag publishes the same product as the desktop workflow. An
      # arbitrary manual label such as `edge` is deliberately not a release.
      - name: Verify release tag matches repository version
        if: github.event_name == 'push'
        run: python3 infra/release_version.py --tag "${{ github.ref_name }}"

      # Non-GitHub-owned actions are pinned by commit SHA, as in release.yml:
      # this produces an artifact that machines pull and run unattended, so a
      # repointed tag must not be able to change what runs here.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A tag push publishes 1.2.3 and 1.2; `latest=auto` moves :latest with
          # it, and leaves it alone for a prerelease (v1.2.3-rc1). A dispatch
          # publishes exactly the tag asked for and never touches :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=auto

      # Single-platform on purpose: the deployment target is an amd64 NAS, and
      # the arm64 half would be a QEMU-emulated build of the whole Node + Python
      # stack on every release to serve nobody. To add it, put
      # `platforms: linux/amd64,linux/arm64` on the push step below and give it
      # a docker/setup-qemu-action — note that the smoke step cannot come with
      # it, because `load: true` only accepts one platform, so the arm64 image
      # would be published untested.
      - name: Build the candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/production.Dockerfile
          load: true
          tags: |
            cairndex:candidate
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CAIRNDEX_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate. Starts the image under its real hardening, creates a library
      # through the API, scans a generated video, asserts a cover came out, and
      # checks that a graceful stop released the ownership lease.
      - name: Smoke-test the candidate
        run: ./infra/docker/smoke.sh cairndex:candidate
        env:
          CAIRNDEX_EXPECTED_BUILD_COMMIT: ${{ github.sha }}

      # Scan the exact local image that passed the smoke test, before any
      # registry operation can change what the tag names. The uploaded JSON is
      # the portable copy; the post-push attestation binds the same document to
      # the immutable GHCR digest.
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: cairndex:candidate
          format: spdx-json
          output-file: cairndex-container.spdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Verify the SPDX SBOM
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("cairndex-container.spdx.json")
          document = json.loads(path.read_text())
          if not str(document.get("spdxVersion", "")).startswith("SPDX-"):
              raise SystemExit(f"invalid SPDX document: {path}")
          if not document.get("packages"):
              raise SystemExit(f"SBOM contains no packages: {path}")
          if path.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit(f"SBOM exceeds GitHub's 16 MiB attestation limit: {path}")
          print(f"SPDX OK: {len(document['packages'])} packages in {path}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: cairndex-container-sbom-${{ inputs.tag || github.ref_name }}
          path: cairndex-container.spdx.json
          if-no-files-found: error

      # Login happens here rather than at the top: nothing before this point
      # needs the registry, and a failed smoke test should not have left an
      # authenticated session lying around on the runner.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the local tags attached to the image that passed the smoke test.
      # A second build could resolve a changed base image or dependency and
      # publish bytes that were never run.
      - name: Push the tested image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          candidate_id=$(docker image inspect cairndex:candidate --format '{{.Id}}')
          manifest_digest=''
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$candidate_id"
            docker push "$tag"
            repository="${tag%:*}"
            repo_digest=$(docker image inspect "$tag" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | awk -v prefix="${repository}@" 'index($0, prefix) == 1 { print; exit }')
            [ -n "$repo_digest" ] || { echo "::error::No registry digest recorded for $tag"; exit 1; }
            pushed_digest="${repo_digest#*@}"
            [[ "$pushed_digest" == sha256:* ]] \
              || { echo "::error::Unexpected registry digest: $pushed_digest"; exit 1; }
            if [ -n "$manifest_digest" ] && [ "$manifest_digest" != "$pushed_digest" ]; then
              echo "::error::Published tags do not share one tested digest"
              exit 1
            fi
            manifest_digest="$pushed_digest"
          done <<< "$IMAGE_TAGS"
          [ -n "$manifest_digest" ] || { echo "::error::No image tags were published"; exit 1; }
          echo "digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: cairndex-container.spdx.json
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pull on the server with \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
