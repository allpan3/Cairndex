name: Release

# Builds the macOS desktop app and publishes it as a draft GitHub release.
#
# Apple Silicon only since v0.1.0 (owner, 2026-07-23). If an architecture is
# ever added back, it needs its own native job rather than a `--target` flag:
# the app bundles a PyInstaller sidecar (ADR-0019 §2), and PyInstaller freezes
# the interpreter that runs it, so it has no cross-compile mode. The Rust half
# *could* cross-compile, but that only moves the problem to the half that
# cannot. See the commented matrix entry below.
#
# The release is created as a **draft**: the artifacts are built and attached,
# and publishing stays a human decision (AGENTS.md — releasing is the owner's
# call, not a workflow's).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the release to (e.g. v0.1.0)"
        required: true
        type: string

# Least privilege: only the publish job writes (it creates the draft release),
# and it grants itself that below. The build jobs run third-party actions and
# must not hold a write-capable token they have no use for — upload-artifact
# needs no `contents` permission at all.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # macOS minutes bill at 10x, and the app+DMG step is compile-bound with no
    # progress output, so a wedged Tauri DMG bundler (it drives Finder over
    # AppleScript — the documented reason CI skips DMG) would otherwise burn
    # hours against the default 6-hour limit before anything killed it. The
    # v0.1.0 run took 7 minutes end to end on a cold cache.
    timeout-minutes: 45
    strategy:
      # Kept a matrix with one entry on purpose: re-adding an architecture is a
      # block of five values, not a restructuring of the job.
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon (arm64)
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            platform: macos-arm64
            uv_python: cpython-3.12-macos-aarch64-none
            arch_suffix: aarch64
          # Intel was dropped after the v0.1.0 run (owner, 2026-07-23): it is not
          # needed, and that runner is roughly 4x slower at the compile-bound
          # steps (98s vs 24s to freeze the same sidecar), on 10x-billed minutes.
          # Nothing else was removed to make this happen — macos-x86_64 is still
          # pinned in ffmpeg-manifest.json and the local Intel build procedure in
          # docs/deployment.md still works — so restoring it means putting this
          # entry back:
          #
          #   - label: Intel (x86_64)
          #     runner: macos-15-intel        # verified usable 2026-07-23
          #     rust_target: x86_64-apple-darwin
          #     platform: macos-x86_64
          #     uv_python: cpython-3.12-macos-x86_64-none
          #     arch_suffix: x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      # Non-GitHub-owned actions are pinned by commit SHA in this workflow: it
      # produces the binaries strangers download, so a repointed tag must not be
      # able to change what runs here. dtolnay/rust-toolchain stays on @stable
      # because that moving branch is its version selector, not a code pin.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/package-lock.json
      - name: Install SPA dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build the SPA
        run: npm run build
        working-directory: apps/web

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.23"
          enable-cache: true
      # Pinned to the matrix architecture rather than left to the runner's
      # default: the sidecar's architecture is whatever interpreter PyInstaller
      # runs under, so this line is what decides it. build_sidecar.py refuses a
      # bundle whose architecture disagrees with --platform, so a wrong
      # interpreter fails the build instead of shipping.
      - name: Sync server dependencies
        run: uv sync --frozen --python ${{ matrix.uv_python }}
        working-directory: apps/server

      - name: Cache the pinned static ffmpeg
        uses: actions/cache@v6
        with:
          path: apps/server/packaging/vendor/ffmpeg/${{ matrix.platform }}
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('apps/server/packaging/ffmpeg-manifest.json') }}
      - name: Fetch the pinned static ffmpeg
        run: uv run python packaging/fetch_ffmpeg.py --platform ${{ matrix.platform }}
        working-directory: apps/server

      - name: Build the sidecar bundle
        run: uv run python packaging/build_sidecar.py --platform ${{ matrix.platform }}
        working-directory: apps/server
      # The last chance to catch a bundle that cannot serve media before it
      # reaches a download page. Runs the frozen server against the bundled
      # ffmpeg and drives real request paths (ADR-0019 §2).
      - name: Smoke-test the packaged sidecar
        run: uv run python packaging/smoke_test.py
        working-directory: apps/server

      # Unlike CI, a release build wants the DMG: it is the artifact people
      # download. Tauri's DMG bundler drives Finder over AppleScript, which is
      # why CI skips it — here it is the point.
      - name: Build the app and DMG
        run: npm run tauri build -- --target ${{ matrix.rust_target }} --bundles app,dmg
        working-directory: apps/desktop

      # Ad-hoc signing is not free — Tauri only signs when `signingIdentity` is
      # set, and a bundle with no resource seal is *invalid* rather than
      # unsigned, which fails harder than being unsigned (ADR-0019 §4). Assert
      # it here so a config regression cannot reach a release.
      - name: Verify the bundle signature
        working-directory: apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 macos/Cairndex.app
          test -f macos/Cairndex.app/Contents/_CodeSignature/CodeResources

      # The four executables must be the architecture this job builds for. The
      # checksum gate cannot see this: it proves the ffmpeg matches the pin for
      # --platform, not that the shell and sidecar agree with it. The bundle's
      # ~50 Python .so/.dylib files are not listed — their architecture follows
      # the pinned interpreter's, which the sidecar executable check covers.
      - name: Verify the executables are ${{ matrix.arch_suffix }}
        working-directory: apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Cairndex.app/Contents
        run: |
          set -euo pipefail
          expected='${{ matrix.platform == 'macos-arm64' && 'arm64' || 'x86_64' }}'
          for binary in MacOS/cairndex-desktop \
                        Resources/cairndex-sidecar/cairndex-sidecar \
                        Resources/cairndex-sidecar/ffmpeg \
                        Resources/cairndex-sidecar/ffprobe; do
            actual=$(file -b "$binary" | sed -n 's/.*Mach-O 64-bit executable \([a-z0-9_]*\).*/\1/p')
            echo "  $binary -> $actual"
            [ "$actual" = "$expected" ] || { echo "::error::$binary is $actual, expected $expected"; exit 1; }
          done

      # Tauri names the DMG with its own version and arch; rename to something
      # a download page can show, and publish a checksum beside it so a user can
      # verify what they got.
      - name: Stage the artifact
        working-directory: apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg
        run: |
          set -euo pipefail
          version=$(node -p "require('${{ github.workspace }}/apps/desktop/src-tauri/tauri.conf.json').version")
          name="Cairndex_${version}_${{ matrix.arch_suffix }}.dmg"
          built=$(ls ./*.dmg | head -1)
          [ "$built" = "./$name" ] || mv "$built" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          mkdir -p "${{ github.workspace }}/release-artifacts"
          cp "$name" "$name.sha256" "${{ github.workspace }}/release-artifacts/"

      - uses: actions/upload-artifact@v7
        with:
          name: cairndex-${{ matrix.arch_suffix }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    # The one place a write-capable token exists (see the workflow-level
    # `contents: read`): creating the draft release needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Tags, so the body step can name the previous one. A shallow
          # checkout has none, and `git describe` would find nothing.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -la artifacts

      # The release body is the changelog's own section for this version, not
      # GitHub's generated pull-request list. The generated list only describes
      # a release when every change arrived through a PR: v0.1.1 was mostly
      # merged directly onto `main` after the repository was recreated, so it
      # named one PR for a release carrying a feature, eleven fixes and a
      # breaking change, and had to be rewritten by hand afterwards.
      #
      # A missing section fails the job. The documented procedure (deployment.md,
      # "Cutting a release") is to move Unreleased under the new version before
      # tagging; failing here is what makes forgetting it visible while it can
      # still be fixed, instead of publishing an empty release.
      - name: Build the release body from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            cat .github/release-preamble.md
            echo
            echo "## What's Changed"
            echo
            python3 infra/release_notes.py "$TAG"
            echo
            # The previous tag is not always the previous *release* (prereleases
            # get tags too), so this is a convenience link, not a claim about
            # what shipped. Omitted when there is no earlier tag.
            if prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null); then
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            fi
          } > release-body.md
          echo "--- release body ---"
          cat release-body.md

      # Draft, so the owner reviews and publishes. The GPL notices ride along
      # because the release artifacts bundle a GPL ffmpeg and the written offer
      # has to travel with them (ADR-0019 §3).
      - name: Draft the release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          # The body comes from CHANGELOG.md via the step above. Generated notes
          # are off: they list pull requests, which describes a release only when
          # every change arrived as one.
          generate_release_notes: false
          body_path: release-body.md
          files: |
            artifacts/*.dmg
            artifacts/*.dmg.sha256
            THIRD-PARTY-NOTICES.md
